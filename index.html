<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>統計タウンクエスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#bfe6f5; --ink:#2b3a4a; --paper:#fffaf0;
  --sun:#ffc93c; --berry:#e8505b; --leaf:#2f8f5b; --line:#d9cdb4;
  --f:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Meiryo",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#2b3a4a;color:var(--ink);font-family:var(--f);font-weight:500;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,summary:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
#app,#app *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{max-width:560px;height:100%;margin:0 auto;background:var(--paper);display:flex;flex-direction:column;position:relative;overflow:hidden}
[hidden]{display:none!important}

header{padding:8px 16px 10px;border-bottom:2px solid var(--line);display:flex;flex-direction:column;gap:4px}
.hrow{display:flex;align-items:center;gap:10px}
.town{flex:1;min-width:0}
.town small{display:block;font-size:12px;color:var(--leaf);font-weight:700}
.town b{font-size:16px;font-weight:700}
.chip{font-size:13px;padding:6px 12px;border-radius:999px;background:#fff;border:2px solid var(--line);white-space:nowrap}
.meter{display:flex;align-items:center;gap:8px;font-size:13px}
.bar{flex:1;height:12px;border-radius:999px;background:#eadfca;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),#ff9f43);border-radius:999px;transition:width .4s}
.bar.half::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--ink)}
.meter b{font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right}

main{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.ask{padding:8px 16px;display:flex;gap:8px;align-items:center;border-bottom:2px solid var(--line);min-height:58px}
.ask .txt{flex:1;min-width:0;font-size:13px}
.ask .txt b{display:block;font-size:15px}
.ib{flex:0 0 auto;height:40px;padding:0 10px;border-radius:12px;background:#fff;border:2px solid var(--line);font-size:14px;white-space:nowrap}

.mapwrap{flex:1;display:grid;place-items:center;background:#1d2733;padding:6px;min-height:0}
#cv{display:block;width:100%;max-width:calc(54vh * 11 / 9);height:auto;border-radius:10px;cursor:pointer;transition:filter .8s;touch-action:manipulation}

.ctl{display:flex;align-items:center;gap:12px;padding:8px 16px 10px;border-top:2px solid var(--line)}
.tip{flex:1;font-size:13px;line-height:1.45;min-width:0}
.pad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,46px);gap:4px;flex:0 0 auto}
.pad button{border-radius:12px;background:#fff;border:2px solid var(--line);font-size:18px;touch-action:none}
.pad button:active{background:var(--sun)}
.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}

.veil{position:absolute;inset:0;background:rgba(43,58,74,.45);display:flex;align-items:flex-end;z-index:5}
.sheet{width:100%;max-height:92%;overflow-y:auto;background:var(--paper);border-radius:20px 20px 0 0;padding:18px 16px 20px;display:flex;flex-direction:column;gap:12px}
.sheet.tall{min-height:92%}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who b{font-size:18px}
.who em{font-style:normal;font-size:12px;color:#6b7785;margin-left:auto}
.say{font-size:17px;line-height:1.6;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.ja{font-size:14px;background:#fff6d6;border-radius:10px;padding:8px 12px}
.note{font-size:12px;color:#6b7785}
.hints{display:flex;flex-direction:column;gap:6px;font-size:14px}
.hints div{background:#fff6d6;border-radius:10px;padding:8px 12px}
.hints b{color:var(--leaf);margin-right:4px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{flex:1 1 120px;padding:12px 14px;border-radius:14px;font-weight:700;background:#fff;border:2px solid var(--line)}
.btn.go{background:var(--berry);border-color:var(--berry);color:#fff}
.btn.sm{flex:0 0 auto;padding:8px 12px;font-size:14px}
.opts{display:grid;grid-template-columns:1fr;gap:8px}
.opt{padding:12px 14px;border-radius:14px;background:#fff;border:2px solid var(--line);font-size:16px;text-align:left;overflow-wrap:anywhere}
.opt.right{background:#d8f3dc;border-color:var(--leaf)}
.opt.wrong{background:#ffe0e3;border-color:var(--berry)}
.fb{border-radius:12px;padding:10px 12px;font-weight:700}
.fb.ok{background:#d8f3dc}.fb.ng{background:#ffe0e3}
.big{font-size:24px;font-weight:700;text-align:center}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stat div{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 2px}
.stat small{display:block;font-size:11px;color:#6b7785}
.stat b{font-size:18px;font-variant-numeric:tabular-nums}
.hist{display:flex;align-items:flex-end;gap:3px;height:150px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 8px 2px}
.hist div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.hist i{display:block;width:100%;background:var(--sun);border-radius:4px 4px 0 0}
.hist small{font-size:10px;min-height:14px}
pre{font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:13px;line-height:1.5;background:#1d2733;color:#e8f0f8;border-radius:10px;padding:10px 12px;margin-top:8px;overflow-x:auto;white-space:pre;font-weight:400}
.opt.mono{font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:14px}
svg.plot{width:100%;background:#fff;border:2px solid var(--line);border-radius:12px}
.opt small{font-size:12px;color:#6b7785}

.foe{display:flex;align-items:center;gap:12px}
.foe span{font-size:60px;line-height:1}
.foe.hit span{animation:shake .4s}
.hpbox{flex:1;display:flex;flex-direction:column;gap:2px;font-size:12px}
.hp{height:14px;border-radius:999px;background:#eadfca;overflow:hidden}
.hp i{display:block;height:100%;background:var(--berry);transition:width .4s}
.hearts{font-size:20px;letter-spacing:2px}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

details{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px}
details.now{border-color:var(--berry)}
summary{font-weight:700;cursor:pointer}
details .memo{background:#eef7ee;border-radius:10px;padding:8px 12px;margin:8px 0}
details .it{border-top:1px dashed var(--line);padding:8px 0}
details .it b{display:block}

.page{padding:24px 16px;display:flex;flex-direction:column;gap:16px;flex:1;background:linear-gradient(var(--sky),var(--paper) 55%)}
.page h1{font-size:30px;line-height:1.2;text-wrap:balance}
.page h2{font-size:19px;text-wrap:balance}
.page ol{padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
.lv{display:flex;flex-direction:column;gap:6px;font-size:14px}
.lv div{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 12px}
.lv .now{border-color:var(--berry)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="hd"></header>
  <main id="main"></main>
  <div id="ov"></div>
</div>
<script>
/* ===== 悩みのデータ =====
   1つの悩み ＝ [タイトル, 悩みの文, [ヒント1, ヒント2, ヒント3], [正解, まちがい×3], 解説]
   悩みを増やしたいときは、町の P:[ ... ] に同じ形で書き足すだけ */
const TOWNS=[
{ja:'はじまりの村コロン',th:'確率のきほん',boss:'🦇',
 memo:'確率 ＝ 起こってほしい場合の数 ÷ 全部の場合の数。／独立なら「かけ算」。／「少なくとも」は余事象（1 − 反対の確率）。／P(AまたはB) ＝ P(A)＋P(B)−P(AかつB)。／組合せ ₙCᵣ は順番を区別しない選び方。',
 P:[
 ['コイン投げで勝てる確率','友だちとコイン投げで遊ぶんだ。表が出たらぼくの勝ち。ぼくは何％の確率で勝てるのかな？',
  ['分かれ道が2本あって、どっちも同じ広さじゃ。目をつぶって歩いたら、右に行くのも左に行くのも同じくらい起こりやすいじゃろ？ コインも同じで、表と裏は同じ出やすさなんじゃ。',
   'コインの出方を全部ならべてみよう。「表」「裏」の2通りだけだよね。そのうち君が勝つのは「表」の1通りだよ。',
   '確率は「勝ちの数 ÷ 全部の数」で出せるの。1 ÷ 2 を％になおしてみて。'],
  ['50％','25％','100％','2％'],
  '確率 ＝ 起こってほしい場合の数 ÷ 全部の場合の数。表は2通りのうち1通りなので 1÷2 ＝ 0.5 ＝ 50％。ただし「どの出方も同じくらい起こりやすい」ことが条件です。'],
 ['サイコロで3の倍数','すごろくで、サイコロを1回ふって「3の倍数」が出たらゴールなの。ゴールできる確率はどれくらい？',
  ['ピザを6等分したと思ってごらん。サイコロの目は1〜6の6切れで、どの1切れも同じ大きさだよ。',
   '1〜6の中で3の倍数はどれかな？ 3と6の2つだね。6切れのうち2切れが当たりだよ。',
   '当たり2切れ ÷ 全部6切れ。約分すると？'],
  ['1/3','1/6','1/2','2/3'],
  '3の倍数は3と6の2通り。全部で6通りなので 2/6 ＝ 1/3（約33％）。'],
 ['コイン2枚とも表','コインを2枚同時に投げて、2枚とも表ならおやつがもらえるんだ。確率は1/2だと思うんだけど、合ってる？',
  ['服の組み合わせで考えよう。シャツが2種類、ズボンが2種類なら、着方は 2×2 で4通りあるよね。',
   'コイン2枚の出方は（表,表）（表,裏）（裏,表）（裏,裏）の4通り。どれも同じ起こりやすさだよ。',
   'おたがいにじゃましない出来事（独立）が両方起こる確率は、かけ算で出せる。1/2 × 1/2 は？'],
  ['1/4','1/2','1/3','3/4'],
  '独立な出来事が両方起こる確率は積で求めます。1/2 × 1/2 ＝ 1/4。全部の4通りのうち（表,表）は1通り、と数えても同じです。'],
 ['少なくとも1回は6','サイコロを2回ふって、少なくとも1回「6」が出れば勝ちなんだ。勝つ確率を知りたいけど、数えるのが大変で…',
  ['「少なくとも1回」を直接数えるのは大変。そんなときは反対から考えるんじゃ。「めがねをかけた子」を数えるより、「かけていない子」を数えて全体から引くほうが早いこともあるじゃろ。',
   '反対の出来事は「2回とも6が出ない」。1回で6が出ない確率は5/6だから、2回とも出ないのは 5/6 × 5/6 ＝ 25/36。',
   '全体は1（＝36/36）。そこから「1回も出ない」25/36 を引いてごらん。'],
  ['11/36','1/36','2/6','25/36'],
  '余事象を使います。P(少なくとも1回) ＝ 1 − P(1回も出ない) ＝ 1 − 25/36 ＝ 11/36（約31％）。「少なくとも」と来たら余事象が定石です。'],
 ['ハートまたは絵札','トランプ52枚から1枚引いて「ハート」または「絵札（J・Q・K）」なら当たりなんだ。ハートは13枚、絵札は12枚だから、当たりは25枚だよね？',
  ['クラスで「犬を飼っている子」と「猫を飼っている子」を数えるとき、両方飼っている子を2回数えちゃうことがあるよね。',
   'ハートの絵札（ハートのJ・Q・K）の3枚は、「ハート」にも「絵札」にも入っているよ。',
   'ダブって数えた分を1回引くんだ。13 ＋ 12 − 3 は何枚？ それを52で割ろう。'],
  ['22/52','25/52','12/52','3/52'],
  '加法定理：P(AまたはB) ＝ P(A) ＋ P(B) − P(AかつB)。13＋12−3 ＝ 22枚なので 22/52。重なりがない（排反）ときだけ、そのまま足せます。'],
 ['5人から2人選ぶ','5人の中から、そうじ当番を2人選ぶんだ。選び方は何通りあるんだろう？ 5×4で20通りかな？',
  ['「AさんとBさん」と「BさんとAさん」は、当番としては同じペアだよね。握手と同じで、順番は関係ないんだ。',
   '順番をつけて選ぶと 5×4 ＝ 20通り（これを順列という）。でも同じペアを2回ずつ数えているよ。',
   '20を「2人のならび方の数（2通り）」で割ってごらん。これを組合せといって ₅C₂ と書くよ。'],
  ['10通り','20通り','25通り','7通り'],
  '順番を区別しない選び方は組合せ。₅C₂ ＝ (5×4)÷(2×1) ＝ 10通り。順番を区別するなら順列で ₅P₂ ＝ 20通りです。']
 ]},
{ja:'霧の町モシモ',th:'条件つき確率とベイズの定理',boss:'👻',
 memo:'条件つき確率 P(A|B) ＝ P(AかつB) ÷ P(B)。／乗法定理 P(AかつB) ＝ P(A)×P(B|A)。／独立 ⇔ P(AかつB) ＝ P(A)P(B)。排反（同時に起こらない）とは別物。／ベイズの定理：結果から原因の確率をさかのぼる。人数に直して数えると分かりやすい。',
 P:[
 ['「偶数だよ」と聞いたあと','サイコロをふったら、友だちが「偶数が出たよ」とだけ教えてくれた。このとき、出た目が「4以上」である確率は？ ふつうに1/2でいいのかな？',
  ['「偶数だよ」と聞いたとたん、世界がせまくなるんじゃ。クラス全員の話から「めがねの子だけ」の話に変わるようなものじゃな。',
   '偶数は2・4・6の3つだけ。新しい「全部」はこの3つだよ。',
   'その3つの中で4以上は4と6の2つ。2 ÷ 3 だね。'],
  ['2/3','1/2','1/3','1/6'],
  '条件つき確率 P(A|B) ＝ P(AかつB) ÷ P(B)。Bが起きたと分かったら、Bの中だけを全体として考えます。(2/6) ÷ (3/6) ＝ 2/3。'],
 ['くじは先に引くと得？','10本中3本が当たりのくじを、引いたくじを戻さずに順番に引くの。先に引く人のほうが有利だと思うんだけど、2番目に引くわたしの当たる確率は？',
  ['よくまぜたトランプの「上から2枚目」がハートのAである確率は、1枚目と同じじゃろ？ 引く順番は、カードの場所の名前にすぎんのじゃ。計算でも確かめてみい。',
   '2番目の人が当たるルートは2つ。「1番目が当たり→自分も当たり」は 3/10 × 2/9 ＝ 6/90。「1番目がはずれ→自分は当たり」は 7/10 × 3/9 ＝ 21/90。',
   '2つのルートを足してみよう。27/90 を約分すると？'],
  ['3/10（先に引く人と同じ）','2/9','3/9','7/10'],
  '乗法定理 P(AかつB) ＝ P(A)×P(B|A) で各ルートを計算して足すと 27/90 ＝ 3/10。くじは何番目に引いても、当たる確率は同じです。'],
 ['「独立」ってなに？','「雨の日」と「わたしがくしゃみをする日」は独立だ、と先生が言ってた。独立って、どういう意味？',
  ['今日のコインの結果は、明日のコインに影響しないよね。おたがいに知らんぷりしている関係が「独立」だよ。',
   '雨だと分かっても、くしゃみの確率が変わらないなら独立。式で書くと P(くしゃみ|雨) ＝ P(くしゃみ)。',
   'これを変形すると、両方起こる確率が「かけ算」で出せる形になるよ。'],
  ['P(AかつB) ＝ P(A)×P(B) が成り立つこと（片方が起きても、もう片方の確率は変わらない）','同時には絶対に起こらないこと','P(A) と P(B) が等しいこと','P(A) ＋ P(B) ＝ 1 になること'],
  'AとBが独立 ⇔ P(AかつB) ＝ P(A)P(B)。「同時に起こらない」は排反で、まったく別の意味です。排反な2つは、片方が起きるともう片方は起きないと分かってしまうので、むしろ独立ではありません。'],
 ['検査で陽性と言われた','100人に1人がかかる病気の検査で「陽性」と出た。この検査は、病気の人を99％正しく陽性にするけど、健康な人も5％はまちがって陽性にするらしい。ぼくが本当に病気の確率は？',
  ['村人1万人で考えてみよう。病気の人は100人、健康な人は9900人。健康な人のほうがずっと多いのがポイントじゃ。',
   '病気の100人のうち陽性は99人。健康な9900人のうち、まちがって陽性になるのは5％で495人だよ。',
   '陽性の人は全部で 99 ＋ 495 ＝ 594人。そのうち本当に病気なのは99人。99 ÷ 594 は？'],
  ['約17％','99％','95％','約1％'],
  'ベイズの定理：P(病気|陽性) ＝ P(陽性|病気)P(病気) ÷ P(陽性) ＝ 0.0099 ÷ 0.0594 ≒ 0.167。もとの病気の割合（事前確率）が小さいと、陽性でも本当に病気の確率は意外と低くなります。'],
 ['不良品はどの機械？','クッキー工場で、機械Aは全体の60％、機械Bは40％を作っている。こげたクッキーの割合はAが1％、Bが3％。こげたクッキーを1枚見つけたとき、それがBで作られた確率は？',
  ['クッキー1000枚で考えよう。Aが600枚、Bが400枚作るよ。足あとから犯人をさがす探偵の気分でね。',
   'Aのこげたクッキーは600枚の1％で6枚。Bは400枚の3％で12枚。',
   'こげたクッキーは全部で18枚。そのうちBのものは12枚だね。'],
  ['2/3','40％','3％','1/2'],
  'P(B|こげ) ＝ 0.4×0.03 ÷ (0.6×0.01 ＋ 0.4×0.03) ＝ 0.012 ÷ 0.018 ＝ 2/3。Bは作る量が少なくても、こげやすいので「犯人」である確率は高くなります。'],
 ['2人のうち少なくとも1人','ぼくがシュートを決める確率は0.6、弟は0.5。おたがい独立だとして、「2人のうち少なくとも1人が決める」確率は？ 足して1.1かな？',
  ['確率は1をこえないよ。0.6＋0.5＝1.1 はおかしいよね。「2人とも決めた場合」を2回数えちゃっているんだ。',
   'コロン村で習った「反対から考える」を使おう。反対は「2人ともはずす」。',
   'はずす確率は 0.4 と 0.5。独立だから、かけ算で0.2。1から引くと？'],
  ['0.8','1.1','0.3','0.5'],
  '1 − 0.4×0.5 ＝ 0.8。加法定理で 0.6 ＋ 0.5 − 0.6×0.5 ＝ 0.8 としても同じです。']
 ]},
{ja:'市場の町ナラベル',th:'データの整理（1つの変数）',boss:'🐺',
 memo:'尺度：名義・順序（質的）／間隔・比例（量的）。／代表値：平均・中央値・最頻値。平均は外れ値に弱く、中央値は強い。／右にすそが長い分布では 最頻値＜中央値＜平均。／相対度数 ＝ 度数 ÷ 全体。／ジニ係数は0に近いほど平等。',
 P:[

{ja:'言葉の都トランス',th:'言葉のAI・Transformer・生成AI',boss:'🐲',

 ['なぜTransformerは速い？','TransformerがRNNより学習が速い理由と、そのために必要になった工夫は？',

  ['文の全単語を同時（並列）に処理できる。ただし順番の情報がなくなるので、位置エンコーディングを足す','1単語ずつ順番に処理する。そのためゲートを追加した','画像にしか使えない。そのため畳み込みを追加した','パラメータが0個。そのため学習がいらない'],

 ['にせものと警察','本物そっくりの画像を作るAI。「GAN」は、どんなしくみで学習する？',

/* ===== 状態 ===== */
// t:今いる町  max:行ける一番先の町  done:解決した悩み（"町-番号"）  nh:ヒントなしで正解した数  tr:修行の回数  fin:全クリア
const S={t:0,max:0,done:[],nh:0,tr:0,fin:0,seen:0};
let V=[],Q=null,B=null,P={x:1,y:1};
let MAP=[],MW=0,MH=0,DOOR={},VPOS=[],START=[1,1],CAM={x:0,y:0};

const $=s=>document.querySelector(s);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function save(){try{localStorage.setItem('stat-town-quest',JSON.stringify(S))}catch(e){}}
function load(){
  try{const d=JSON.parse(localStorage.getItem('stat-town-quest'));if(d&&typeof d.t==='number'&&Array.isArray(d.done))Object.assign(S,d)}catch(e){}
  if(S.fin&&(S.max|0)<HON)S.max=HON;
  if(S.fin>=2&&(S.max|0)<DEEP)S.max=DEEP;   // 本編クリアずみのセーブは、裏ステージを開く
  S.max=Math.max(0,Math.min(S.max|0,TOWNS.length-1));S.t=Math.max(0,Math.min(S.t|0,S.max));
}
const ura=()=>S.t>=HON;
const tnum=t=>t<HON?'町'+(t+1):t<DEEP?'裏'+(t-HON+1):'裏裏'+(t-DEEP+1);
const grp=t=>t<HON?0:t<DEEP?1:2;
const stageLabel=()=>S.t<HON?'町 '+(S.t+1)+' / '+HON:S.t<DEEP?'裏ステージ '+(S.t-HON+1)+' / '+(DEEP-HON):'裏の裏 '+(S.t-DEEP+1)+' / '+(TOWNS.length-DEEP);
const mono=p=>p[1].includes('<pre>')?'mono':'';
const signOf=pl=>pl==='coin'&&ura()?'🤖 AIラボ':SIGN[pl];
const tid=(t,k)=>t+'-'+k;
const solved=(t,k)=>S.done.includes(tid(t,k));
const nSolved=t=>TOWNS[t].P.filter((_,k)=>solved(t,k)).length;
const townDone=t=>nSolved(t)===TOWNS[t].P.length;
const hap=()=>Math.round(100*nSolved(S.t)/TOWNS[S.t].P.length);
const prob=id=>{const [t,k]=String(id).split('-').map(Number);return TOWNS[t]&&TOWNS[t].P[k]};

/* ===== 村人と悩みの割りふり ===== */
// 困っている人は同時に3人まで。悩みは番号の小さい順（やさしい順）に出す
function refill(skip){
  let free=shuffle(V.map((_,i)=>i).filter(i=>V[i].q===null&&i!==skip));
  const pend=TOWNS[S.t].P.map((_,k)=>k).filter(k=>!solved(S.t,k)&&!V.some(v=>v.q===k));
  while(V.filter(v=>v.q!==null).length<3&&pend.length){
    if(!free.length){if(skip>=0&&V[skip].q===null){free=[skip];skip=-1}else break}
    V[free.shift()].q=pend.shift();
  }
}
function loadTown(){
  let rows=S.t%2?LAY_B:LAY_A;
  if(S.t%4>=2)rows=rows.map(r=>[...r].reverse().join(''));
  MAP=rows.map(r=>[...r]);MH=MAP.length;MW=MAP[0].length;DOOR={};VPOS=[];
  MAP.forEach((row,y)=>row.forEach((ch,x)=>{
    if(PLK[ch])DOOR[PLK[ch]]=[x,y];
    else if(ch==='v'){VPOS.push([x,y]);row[x]='.'}
    else if(ch==='@'){START=[x,y];row[x]=','}
  }));
}
function enterTown(){
  Q=null;B=null;loadTown();P={x:START[0],y:START[1]};mv=null;path=[];held=null;face=[0,1];
  V=[0,1,2,3,4,5].map(n=>({name:NAMES[(S.t*6+n)%NAMES.length],q:null}));
  refill(-1);
  drawStage(townDone(S.t)?'この町の悩みは全部解決ずみ。広場（噴水）でまとめの魔物と戦えます':'！マークの村人のところまで歩いて、話しかけよう');
}
function blocked(x,y){
  if(x<0||y<0||x>=MW||y>=MH)return true;
  return '#~=hMCGPQ'.includes(MAP[y][x]);
}
function ents(){
  const a=Object.keys(DOOR).map(pl=>({t:'place',pl,x:DOOR[pl][0],y:DOOR[pl][1]}));
  V.forEach((v,i)=>a.push({t:'vil',i,x:VPOS[i][0],y:VPOS[i][1]}));
  return a;
}

/* ===== 絵を描く（キャンバス） ===== */
const hash=(x,y)=>(((x*73856093)^(y*19349663))>>>0)%9973;
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function pill(g,text,cx,cy,size,color){
  g.font=`700 ${size||15}px "Zen Maru Gothic","Meiryo",${EMO}`;g.textAlign='center';g.textBaseline='middle';
  const w=g.measureText(text).width+14,h=(size||15)+9;
  g.fillStyle='#fff';rr(g,cx-w/2,cy-h/2,w,h,h/2);g.fill();
  g.strokeStyle='rgba(43,58,74,.35)';g.lineWidth=1.5;g.stroke();
  g.fillStyle=color||'#2b3a4a';g.fillText(text,cx,cy+1);
}
function tree(g,x,y,type,th){
  g.fillStyle='#8a5a34';
  if(type==='pine'){
    g.fillRect(x+28,y+44,8,16);g.fillStyle=th.leaf;
    g.beginPath();g.moveTo(x+32,y+2);g.lineTo(x+54,y+34);g.lineTo(x+10,y+34);g.fill();
    g.fillStyle=th.leaf2;g.beginPath();g.moveTo(x+32,y+18);g.lineTo(x+58,y+50);g.lineTo(x+6,y+50);g.fill();
  }else if(type==='palm'){
    g.fillRect(x+29,y+24,6,36);g.fillStyle=th.leaf;
    [[-18,-6,-.5],[18,-6,.5],[-14,6,.4],[14,6,-.4]].forEach(([dx,dy,r])=>{g.beginPath();g.ellipse(x+32+dx,y+20+dy,18,7,r,0,7);g.fill()});
    g.fillStyle=th.leaf2;g.beginPath();g.arc(x+32,y+20,6,0,7);g.fill();
  }else{
    g.fillRect(x+26,y+38,12,22);
    g.fillStyle=th.leaf;g.beginPath();g.arc(x+32,y+26,23,0,7);g.fill();
    g.fillStyle=th.leaf2;g.beginPath();g.arc(x+24,y+18,9,0,7);g.fill();
  }
}
function drawTile(g,ch,tx,ty,x,y,now){
  const th=THEMES[S.t],h=hash(tx,ty);
  if(ch==='~'){
    g.fillStyle=th.water;g.fillRect(x,y,T,T);
    g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=3;g.lineCap='round';
    const o=Math.sin(now/600+h)*6,yy=y+16+(h%4)*10;
    g.beginPath();g.moveTo(x+12+o,yy);g.lineTo(x+34+o,yy);g.stroke();
    return;
  }
  const road=ch===',';
  g.fillStyle=road?th.path:th.grass;g.fillRect(x,y,T,T);
  g.fillStyle=road?'rgba(0,0,0,.07)':'rgba(0,70,0,.14)';
  g.fillRect(x+6+h%40,y+8+(h>>3)%40,road?7:4,road?4:10);
  g.fillRect(x+4+(h>>5)%44,y+6+(h>>7)%44,road?5:4,road?4:8);
  if(ch==='#')tree(g,x,y,th.tree,th);
  else if(ch==='f'){
    ['#ff7aa8','#ffd84a','#ffffff'].forEach((c,i)=>{const fx=x+14+i*17,fy=y+20+((h>>i)%3)*10;
      g.fillStyle=c;g.beginPath();g.arc(fx,fy,6,0,7);g.fill();g.fillStyle='#f39c12';g.beginPath();g.arc(fx,fy,2.2,0,7);g.fill()});
  }else if(ch==='='){
    g.fillStyle='#a8763e';g.fillRect(x,y+22,T,7);g.fillRect(x,y+40,T,7);
    g.fillStyle='#8a5a34';g.fillRect(x+6,y+12,9,42);g.fillRect(x+T-15,y+12,9,42);
  }else if(ch==='P'){
    g.fillStyle='#8a5a34';g.fillRect(x+4,y+10,10,52);g.fillRect(x+T-14,y+10,10,52);
    g.fillStyle=th.leaf;rr(g,x,y+2,T,18,9);g.fill();
  }else if(ch==='Q'){
    g.fillStyle='#b9b2a6';g.beginPath();g.arc(x+32,y+34,28,0,7);g.fill();
    g.fillStyle=th.water;g.beginPath();g.arc(x+32,y+34,21,0,7);g.fill();
    g.fillStyle='#fff';g.beginPath();g.arc(x+32,y+34-Math.abs(Math.sin(now/400))*6,6,0,7);g.fill();
  }
}
function drawHouse(g,x,y,pl){
  const th=THEMES[S.t];
  g.fillStyle=th.wall;g.fillRect(x-T+4,y-T*.35,T*3-8,T*1.35);
  g.strokeStyle='rgba(43,58,74,.3)';g.lineWidth=2;g.strokeRect(x-T+4,y-T*.35,T*3-8,T*1.35);
  g.fillStyle=th.roof;g.beginPath();g.moveTo(x-T-4,y-T*.3);g.lineTo(x-T+20,y-T*1.02);g.lineTo(x+T*2-20,y-T*1.02);g.lineTo(x+T*2+4,y-T*.3);g.fill();
  g.fillStyle='rgba(0,0,0,.15)';g.fillRect(x-T+4,y-T*.3,T*3-8,6);
  g.fillStyle='#7a4a2a';rr(g,x+14,y+10,T-28,T-10,8);g.fill();
  g.fillStyle='#ffd84a';g.beginPath();g.arc(x+T-22,y+38,3,0,7);g.fill();
  g.fillStyle='#bfe6f5';g.fillRect(x-T+20,y+8,26,26);g.fillRect(x+T+18,y+8,26,26);
  g.strokeStyle='#fff';g.lineWidth=3;g.strokeRect(x-T+20,y+8,26,26);g.strokeRect(x+T+18,y+8,26,26);
  pill(g,signOf(pl),x+T/2,y-T*.62,15);
}
function person(g,x,y,c,f,ph,hero){
  const bob=ph?Math.abs(Math.sin(ph))*2:0,l=ph?Math.sin(ph)*4:0;
  g.fillStyle='rgba(0,0,0,.2)';g.beginPath();g.ellipse(x+32,y+59,16,5,0,0,7);g.fill();
  g.fillStyle=c.pants;g.fillRect(x+23,y+46,7,12-Math.max(0,l));g.fillRect(x+34,y+46,7,12-Math.max(0,-l));
  g.fillStyle=c.shirt;rr(g,x+19,y+29-bob,26,20,6);g.fill();
  g.fillStyle=c.skin;g.beginPath();g.arc(x+32,y+20-bob,13,0,7);g.fill();
  g.fillStyle=c.hair;g.beginPath();
  if(f[1]<0)g.arc(x+32,y+20-bob,13.5,0,7);else g.arc(x+32,y+18-bob,13.5,Math.PI,0);
  g.fill();
  if(f[1]>=0){
    g.fillStyle='#2b3a4a';
    if(f[0]===0){g.fillRect(x+26,y+20-bob,3,5);g.fillRect(x+35,y+20-bob,3,5)}
    else g.fillRect(x+31+f[0]*6,y+20-bob,3,5);
  }
  if(hero){
    g.fillStyle='#b5651d';g.beginPath();g.ellipse(x+32,y+11-bob,19,5,0,0,7);g.fill();
    rr(g,x+22,y-1-bob,20,12,5);g.fill();
    g.fillStyle='#e8505b';g.fillRect(x+22,y+7-bob,20,3);
  }
}
function render(now){
  const cv=$('#cv');if(!cv)return;
  const g=cv.getContext('2d');if(!g)return;
  let px=P.x,py=P.y,ph=0;
  if(mv){const p=Math.min(1,(now-mv.t0)/STEP);px=mv.fx+(P.x-mv.fx)*p;py=mv.fy+(P.y-mv.fy)*p;ph=now/70}
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const cx=clamp(px+.5-VW/2,0,MW-VW),cy=clamp(py+.5-VH/2,0,MH-VH);
  CAM={x:cx,y:cy};
  g.fillStyle='#1d2733';g.fillRect(0,0,cv.width,cv.height);
  for(let ty=Math.floor(cy);ty<=Math.floor(cy)+VH;ty++)for(let tx=Math.floor(cx);tx<=Math.floor(cx)+VW;tx++){
    if(tx<0||ty<0||tx>=MW||ty>=MH)continue;
    drawTile(g,MAP[ty][tx],tx,ty,Math.round((tx-cx)*T),Math.round((ty-cy)*T),now);
  }
  const list=ents();list.push({t:'me',x:px,y:py});list.sort((a,b)=>a.y-b.y);
  const wave=Math.sin(now/250)*3;
  for(const o of list){
    const x=Math.round((o.x-cx)*T),y=Math.round((o.y-cy)*T);
    if(x<-T*3||y<-T*2||x>cv.width+T*2||y>cv.height+T*2)continue;
    if(o.t==='place'){
      if(o.pl==='forest')pill(g,SIGN.forest,x+T/2,y-10,14);
      else if(o.pl==='square'){
        if(townDone(S.t))pill(g,TOWNS[S.t].boss+' まとめの魔物',x+T/2,y-12+wave,15,'#e8505b');
        else pill(g,SIGN.square,x+T/2,y-10,14);
      }else drawHouse(g,x,y,o.pl);
    }else if(o.t==='vil'){
      const v=V[o.i];
      person(g,x,y,VC[o.i],[0,1],0);
      let mk='♥',col='#e86aa0',sz=14,bob=0;
      if(Q&&Q.i===o.i){mk='★';col='#2f6fd0';sz=18;bob=Q.got>=3}
      else if(Q&&Q.hv.includes(o.i)){if(Q.gave[o.i]==null){mk='💡';sz=18;bob=1}else{mk='✓';col='#2f8f5b';sz=16}}
      else if(v.q!==null){mk='!';col='#e8505b';sz=20;bob=!Q}
      pill(g,mk,x+T/2,y-12+(bob?wave:0),sz,col);
      pill(g,v.name,x+T/2,y+T+4,12);
    }else person(g,x,y,HEROC,face,ph,true);
  }
}

  const TN=TOWNS[S.t],h=hap();
  $('#hd').innerHTML=`<div class="hrow">
    <div class="town"><small>${stageLabel()} ・ ${TN.th}</small><b>${TN.ja}</b></div>

   <div class="meter"><span>幸福度</span><div class="bar"><i style="width:${h}%"></i></div><b>${h}%</b></div>`;
}
function drawStage(tip){
  drawHeader();
  let ask;
  if(Q){
    ask=`<div class="ask"><div class="txt">${V[Q.i].name} の悩み<b>${TOWNS[S.t].P[Q.k][0]}</b></div>
      <button class="ib" onclick="answerSheet(true)" aria-label="悩みと集めたヒントを見る">💡 ヒント ${Q.got}/3</button></div>`;
  }else{
    ask=`<div class="ask"><div class="txt">いまは悩みを聞いていません。<br>！マークの村人に話しかけてみよう。</div></div>`;
  }

   <div class="mapwrap"><canvas id="cv" width="${VW*T}" height="${VH*T}" style="filter:saturate(${sat})" onclick="tapMap(event)" aria-label="町のマップ。矢印キーか十字ボタンで主人公を動かせます"></canvas></div>
   <div class="ctl"><p class="tip" id="tip">${tip||''}</p>
     <div class="pad">
       <button class="u" onpointerdown="pad(0,-1)" aria-label="上へ">▲</button>
       <button class="l" onpointerdown="pad(-1,0)" aria-label="左へ">◀</button>
       <button class="d" onpointerdown="pad(0,1)" aria-label="下へ">▼</button>
       <button class="r" onpointerdown="pad(1,0)" aria-label="右へ">▶</button>
     </div></div>`;
  if(!running){running=true;requestAnimationFrame(tick)}
}
const setTip=m=>{const t=$('#tip');if(t)t.textContent=m};
const busy=()=>$('#ov').innerHTML!==''||!$('#cv');
function ov(html,tall){$('#ov').innerHTML=`<div class="veil"><div class="sheet ${tall?'tall':''}">${html}</div></div>`}
function closeOv(){onBack=null;$('#ov').innerHTML=''}

/* ===== 移動 ===== */
function tick(now){
  if(!$('#cv')){running=false;return}
  if(mv&&now-mv.t0>=STEP)mv=null;
  if(!mv&&!busy()){
    let d=null;
    if(path.length){const s=path.shift();d=[s[0]-P.x,s[1]-P.y]}
    else if(held)d=held;
    if(d)step(d[0],d[1],now);
  }
  render(now);
  requestAnimationFrame(tick);
}
function step(dx,dy,now){
  if(Math.abs(dx)+Math.abs(dy)!==1){path=[];return}
  face=[dx,dy];
  const nx=P.x+dx,ny=P.y+dy,o=ents().find(e=>e.x===nx&&e.y===ny);
  if(o){path=[];held=null;bump(o);return}
  if(blocked(nx,ny)){path=[];return}
  mv={fx:P.x,fy:P.y,t0:now};P={x:nx,y:ny};
}

const KEYS={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
addEventListener('keydown',e=>{

});

// マップをタップすると、そこまで自動で歩く（道順は幅優先探索で探す）
function findPath(tx,ty){
  const es=ents(),occ=(x,y)=>blocked(x,y)||es.some(e=>e.x===x&&e.y===y),key=(x,y)=>y*MW+x;
  const prev=new Map([[key(P.x,P.y),null]]),q=[[P.x,P.y]];let found=false;
  while(q.length){
    const [x,y]=q.shift();
    if(x===tx&&y===ty){found=true;break}
    for(const [dx,dy] of [[0,-1],[0,1],[-1,0],[1,0]]){
      const nx=x+dx,ny=y+dy;
      if(nx<0||ny<0||nx>=MW||ny>=MH||prev.has(key(nx,ny)))continue;
      if(occ(nx,ny)&&!(nx===tx&&ny===ty))continue;
      prev.set(key(nx,ny),[x,y]);q.push([nx,ny]);
    }
  }
  if(!found)return [];
  const out=[];let n=[tx,ty];
  while(n&&!(n[0]===P.x&&n[1]===P.y)){out.unshift(n);n=prev.get(key(n[0],n[1]))}
  return out;
}
function tapMap(ev){
  if(busy())return;
  const m=$('#cv').getBoundingClientRect();
  const tx=Math.floor(CAM.x+(ev.clientX-m.left)/m.width*VW),ty=Math.floor(CAM.y+(ev.clientY-m.top)/m.height*VH);
  held=null;path=findPath(tx,ty);
}

 bayes(o){

function polyfit(xs,ys,d){
  const n=d+1,A=Array.from({length:n},()=>Array(n+1).fill(0));
  xs.forEach((x,i)=>{const p=[];for(let j=0;j<n;j++)p.push(Math.pow(x,j));for(let r=0;r<n;r++){for(let c=0;c<n;c++)A[r][c]+=p[r]*p[c];A[r][n]+=p[r]*ys[i]}});
  for(let r=0;r<n;r++)A[r][r]+=1e-9;
  for(let c=0;c<n;c++){let m=c;for(let r=c+1;r<n;r++)if(Math.abs(A[r][c])>Math.abs(A[m][c]))m=r;[A[c],A[m]]=[A[m],A[c]];
    for(let r=0;r<n;r++)if(r!==c){const f=A[r][c]/A[c][c];for(let k=c;k<=n;k++)A[r][k]-=f*A[c][k]}}
  return A.map((row,i)=>row[n]/row[i]);
}

  const pr=tp+fp?tp/(tp+fp):0,rc=tp/100,f1=pr+rc?2*pr*rc/(pr+rc):0;
  ov(`<p class="big">🚨 混同行列としきい値</p>
    <p class="note">病気の人100人と、健康な人100人に、AIが「病気らしさ」の点数（0〜1）をつけました。点数がしきい値以上なら「病気」と判定します。しきい値を動かして、見のがしと、まちがい警報の入れかわりを見よう。</p>
    <p class="note">しきい値</p><div class="btns">${segs('thr','t',[0.3,0.5,0.7],H.t)}</div>
    ${stat([['病気を発見（TP）',tp],['見のがし（FN）',fn],['まちがい警報（FP）',fp],['健康と正解（TN）',tn]])}
    ${stat([['適合率',pr.toFixed(2)],['再現率',rc.toFixed(2)],['F値',f1.toFixed(2)],['正解率',((tp+tn)/200).toFixed(2)]])}
    <p class="note">しきい値を下げる（0.3）と、見のがしはへる（再現率↑）けれど、まちがい警報がふえる（適合率↓）。上げる（0.7）と、その逆。どちらを重く見るかは、使い道で決めます。</p>
    <div class="btns"><button class="btn" onclick="EX.thr({run:1})">▶ データを作り直す</button></div>${labFoot}`);
 },
 conv(o){
  const c=X.cv;
  if(o)Object.assign(c,o);
  const out=Math.floor((c.n+2*c.p-c.k)/c.s)+1;
  ov(`<p class="big">🔍 畳み込みの出力サイズ</p>
    <p class="note">公式：出力 ＝ (入力 ＋ 2×パディング − フィルタ) ÷ ストライド ＋ 1。数字を変えて、答えがどう変わるか確かめよう。</p>
    <p class="note">入力の大きさ</p><div class="btns">${segs('conv','n',[28,32,224],c.n)}</div>
    <p class="note">フィルタの大きさ</p><div class="btns">${segs('conv','k',[3,5,7],c.k)}</div>
    <p class="note">ストライド（ずらすはば）</p><div class="btns">${segs('conv','s',[1,2],c.s)}</div>
    <p class="note">パディング（まわりにうめる0のはば）</p><div class="btns">${[0,1,2,3].map(v=>`<button class="btn sm" style="${v===c.p?'border-color:var(--berry);background:#ffe9ec':''}" onclick="EX.conv({p:${v}})">${v}</button>`).join('')}</div>
    <div class="say">(${c.n} ＋ 2×${c.p} − ${c.k}) ÷ ${c.s} ＋ 1 ＝ <b>${out}</b>　→　出力は ${out}×${out}</div>
    <p class="note">割り切れないときは、小数点以下を切りすてます。「フィルタ3・パディング1・ストライド1」や「フィルタ5・パディング2・ストライド1」だと、出力が入力と同じ大きさになることも確かめよう。</p>${labFoot}`);
 },
 temp(o){
  const M=X.tp,words=['晴れ','くもり','雨','雪','カレー'],z=[2.5,1.5,1.0,-0.5,-1.5];
  if(o&&o.t){M.t=o.t;M.out=''}
  const e=z.map(v=>Math.exp(v/M.t)),sum=e.reduce((a,b)=>a+b,0),p=e.map(v=>v/sum);
  if(o&&o.run){const out=[];for(let k=0;k<12;k++){let r=Math.random(),i=0;while(i<4&&r>p[i]){r-=p[i];i++}out.push(words[i])}M.out=out.join('、 ')}
  ov(`<p class="big">🌡️ 温度</p>
    <p class="note">言語モデルが「今日の天気は ___」の続きをえらぶ場面です。モデルが出した点数は、晴れ2.5、くもり1.5、雨1.0、雪−0.5、カレー−1.5。点数を温度で割ってからソフトマックスに通して確率にし、その確率でくじを引きます。</p>
    <p class="note">温度</p><div class="btns">${segs('temp','t',[0.2,1,3],M.t)}</div>
    ${hist(words.map((w,i)=>w+' '+(p[i]*100).toFixed(0)+'%'),p)}
    <div class="say">今日の天気は → ${M.out||'（「12回えらぶ」を押してみよう）'}</div>
    <p class="note">温度0.2：ほぼ「晴れ」だけ。安定するけれどワンパターン。温度3：差がならされて、「カレー」のような変な答えも出てきます。</p>
    <div class="btns"><button class="btn" onclick="EX.temp({run:1})">▶ 12回えらぶ</button></div>${labFoot}`);
 },
 band(o){
  const D=X.bd,P=[0.3,0.5,0.7];
  if(o&&o.e!==undefined){D.e=o.e;D.r=null}
  if(o&&o.run){const n=[0,0,0],q=[0,0,0];let tot=0;
    for(let k=0;k<1000;k++){let a;if(Math.random()<D.e)a=Math.floor(Math.random()*3);else{a=0;for(let i=1;i<3;i++)if(q[i]>q[a])a=i}
      const r=Math.random()<P[a]?1:0;n[a]++;q[a]+=(r-q[a])/n[a];tot+=r}
    D.r={n,tot}}
  const r=D.r;
  ov(`<p class="big">🎰 スロットマシン</p>
    <p class="note">3台のスロットマシンの当たる確率は、じつは 1番30％、2番50％、3番70％。でもAIはそれを知りません。1000回引いて、当たりの合計を多くしたい。確率 ε でランダムな台をためし（探索）、それ以外は、今いちばん当たっている台を引きます（活用）。</p>
    <p class="note">ε（ためす割合）</p><div class="btns">${[0,0.1,1].map(v=>`<button class="btn sm" style="${v===D.e?'border-color:var(--berry);background:#ffe9ec':''}" onclick="EX.band({e:${v}})">${v}</button>`).join('')}</div>
    ${hist(['1番（30%）','2番（50%）','3番（70%）'],r?r.n:[0,0,0],k=>k===2)}
    ${stat([['1番を引いた',r?r.n[0]:'―'],['2番',r?r.n[1]:'―'],['3番',r?r.n[2]:'―'],['当たりの合計',r?r.tot:'―']])}
    <p class="note">ε＝0（探索なし）：最初に当たった台にこだわり、1番や2番を引き続けることが多い。ε＝1（探索だけ）：学んだことを使わないので約500回。ε＝0.1：たまにためすおかげで3番を見つけ、700回近くまでのびます。何度か押して、くらべてみよう。</p>
    <div class="btns"><button class="btn" onclick="EX.band({run:1})">▶ 1000回引く</button></div>${labFoot}`);
 }
});

/* ===== 図書館（ノート） ===== */
function notebook(){
  resetArm=false;
  const towns=TOWNS.map((TN,t)=>{
    if(t>S.max)return '';
    const items=TN.P.map((p,k)=>solved(t,k)?`<div class="it"><b>${p[0]}</b>答え：${p[3][0]}<br><small>${p[4]}</small></div>`:'').join('');
    return `<details class="${t===S.t?'now':''}" ${t===S.t?'open':''}><summary>${tnum(t)} ${TN.ja}（${TN.th}） ${nSolved(t)}/${TN.P.length}</summary>
      <div class="memo"><b>公式メモ</b><br>${TN.memo.split('／').join('<br>')}</div>
      ${items||'<p class="note">まだ解決した悩みがありません。</p>'}
      ${t===S.t?'':`<div class="btns"><button class="btn sm" onclick="goTown(${t})">この町へ行く</button></div>`}</details>`;
  }).join('');
  ov(`<p class="big">📖 ノート</p>
    <p class="note">解決した悩み ${S.done.length} / ${TOWNS.reduce((a,t)=>a+t.P.length,0)} 問 ・ ヒントなしで正解 ${S.nh} 問 ・ 修行 ${S.tr} 回。町の名前をタップすると、公式メモと解説が開きます。</p>
    ${towns}
    ${S.max<DEEP?`<div class="btns">${S.max<HON?`<button class="btn sm" onclick="openTo(${HON})">🔓 裏ステージ（AI編）を今すぐ開く</button>`:''}<button class="btn sm" onclick="openTo(${DEEP})">🔓 裏の裏（Python実装編）を今すぐ開く</button></div><p class="note">裏ステージは本編を、裏の裏は裏ステージをクリアすると開きます。先に遊びたいときは、このボタンで開けます。</p>`:''}
    <div class="btns"><button class="btn sm" id="rs" onclick="armReset()">最初からやり直す</button>
    <button class="btn go" onclick="closeOv()">とじる</button></div>`);
}
function armReset(){
  if(resetArm){closeOv();restart();return}
  resetArm=true;$('#rs').textContent='本当に消す？ もう一度押すとリセット';
}
function openTo(t){S.max=Math.max(S.max,t);save();notebook()}
function goTown(t){S.t=t;save();closeOv();enterTown()}

/* ===== 広場と修行の森 ===== */
function squareSheet(){
  const TN=TOWNS[S.t],done=townDone(S.t),left=TN.P.length-nSolved(S.t),cleared=S.max>S.t||(S.fin&&S.t===TOWNS.length-1);
  ov(`<p class="big">⛲ ${TN.ja}の広場</p>
    <p>この町で学ぶこと：<b>${TN.th}</b></p>
    <div class="ja"><b>公式メモ</b><br>${TN.memo.split('／').join('<br>')}</div>
    <p class="note">${done?'まとめの魔物 '+TN.boss+' があらわれた！ この町の悩みから5問出題されます（魔物の体力5、あなたの体力3）。たおすと次の町へ進めます。':'あと '+left+' 人の悩みを解決すると、まとめの魔物があらわれます。'}</p>
    <div class="btns"><button class="btn" onclick="closeOv()">とじる</button>
      ${done?`<button class="btn go" onclick="startBattle(true)">⚔️ まとめの魔物と戦う</button>`:''}
      ${cleared&&S.t<TOWNS.length-1?`<button class="btn" onclick="nextTown()">次の町へ →</button>`:''}</div>`);
}
function forestSheet(){
  if(!S.done.length){setTip('修行の森：まだ解決した悩みがない。まず村人を助けてから来よう');return}
  ov(`<p class="big">🌳 修行の森</p>
    <p>これまでに解決した ${S.done.length} 問の中から出題される、復習バトルです（魔物の体力3、あなたの体力3）。</p>
    <p class="note">忘れたころにもう一度解くと、記憶に残りやすくなります。修行した回数：${S.tr} 回</p>
    <div class="btns"><button class="btn" onclick="closeOv()">やめる</button><button class="btn go" onclick="startBattle(false)">⚔️ 修行する</button></div>`);
}
function startBattle(boss){
  const pool=boss?TOWNS[S.t].P.map((_,k)=>tid(S.t,k)):S.done.filter(prob);
  const hp=boss?5:3;
  B={boss,e:boss?TOWNS[S.t].boss:pick(WILD),hp,max:hp,me:3,pool:shuffle(pool),n:0};
  nextQ();drawBattle();
}
function nextQ(){
  if(B.n&&B.n%B.pool.length===0)B.pool=shuffle(B.pool);
  B.p=prob(B.pool[B.n++%B.pool.length]);B.opts=shuffle([0,1,2,3]);B.fb=null;B.pick=-1;
}
function drawBattle(){
  const p=B.p,fb=B.fb;
  const res=!fb?`<div class="btns"><button class="btn sm" onclick="runAway()">にげる</button></div>`
    :`<div class="fb ${fb.ok?'ok':'ng'}">${fb.ok?'✨ 正解！ 魔物に1ダメージ':'💥 まちがい… 1ダメージを受けた'}</div>
      <div class="ja">${p[4]}</div>
      <div class="btns"><button class="btn go" onclick="nextStep()">つづける</button></div>`;
  ov(`<div class="foe ${fb&&fb.ok?'hit':''}"><span>${B.e}</span><div class="hpbox"><div class="hp"><i style="width:${B.hp/B.max*100}%"></i></div>
      <small>${B.boss?'まとめの魔物':'森の魔物'}の体力 ${B.hp} / ${B.max}</small></div></div>
    <div class="hearts" aria-label="自分の体力 ${B.me}">${'❤️'.repeat(B.me)}${'🤍'.repeat(3-B.me)}</div>
    <p class="note">${p[0]}</p><div class="say">${p[1]}</div>
    <div class="opts">${B.opts.map(c=>`<button class="opt ${mono(p)} ${fb?(c===0?'right':c===B.pick?'wrong':''):''}" onclick="hit(${c})" ${fb?'disabled':''}>${p[3][c]}</button>`).join('')}</div>
    ${res}`,true);
}
function hit(c){
  if(B.fb)return;
  B.pick=c;const ok=c===0;
  if(ok)B.hp--;else B.me--;
  B.fb={ok};drawBattle();
}
function nextStep(){
  if(B.hp<=0){
    const boss=B.boss;B=null;
    if(boss){townClear();return}
    S.tr++;save();closeOv();setTip('森の魔物をたおした！ 修行 '+S.tr+' 回目、おつかれさま');
  }else if(B.me<=0){
    const boss=B.boss;B=null;closeOv();
    setTip('負けてしまった…。'+(boss?'ノートの公式メモを読み直して、もう一度広場で挑戦しよう':'ノートで解説を読み直して、また修行しよう'));
  }else{nextQ();drawBattle()}
}
function runAway(){B=null;closeOv();setTip('にげた。準備ができたら、もう一度挑戦しよう')}

/* ===== そのほかの画面 ===== */
function levelList(now){
  return `<div class="lv">${TOWNS.map((t,k)=>grp(k)===grp(now)?`<div class="${k===now?'now':''}"><b>${tnum(k)} ${t.ja}</b>　${t.th}</div>`:'').join('')}</div>`;
}
function townClear(){
  onBack=null;
  const TN=TOWNS[S.t],last=S.t===TOWNS.length-1,honLast=S.t===HON-1,uraLast=S.t===DEEP-1;
  const score=`<p>解決した悩み：${S.done.length+0} 問　／　ヒントなしで正解：${S.nh} 問　／　修行：${S.tr} 回</p>`;
  $('#ov').innerHTML='';
  if(last){
    S.fin=3;save();
    $('#main').innerHTML=`<div class="page"><h1>🏆 裏の裏まで完全クリア！</h1>
      <h2>統計・AI・実装、全${TOWNS.length}の町を救いました。おめでとう！</h2>${score}
      <p>コードの穴埋めは、読むだけでなく、自分のPCのPythonで実際に動かすと一気に身につきます。ノートの解説を見ながら、ここで出てきた関数を自分で打ちこんで、print で形や値を確かめてみましょう。E資格をめざすなら、次はJDLA認定プログラムの教材と問題で練習を重ねる番です。</p>
      <div class="btns"><button class="btn" onclick="notebook()">📖 ノートを見る</button>
      <button class="btn go" onclick="enterTown()">町にもどる</button></div></div>`;
    return;
  }
  if(S.max<=S.t)S.max=S.t+1;
  if(honLast)S.fin=Math.max(S.fin,1);
  if(uraLast)S.fin=Math.max(S.fin,2);
  save();
  const N=TOWNS[S.t+1];
  if(honLast){
    $('#main').innerHTML=`<div class="page"><h1>👑 全部の町が幸せになった！</h1>
      <h2>本編の${HON}の町をすべて救いました。おめでとう！</h2>${score}
      <p>これで統計検定2級の主な考え方をひととおり学びました。仕上げに、公式問題集（過去問）で「時間内に計算する練習」と「数表の読み取り」をしましょう。</p>
      <h2>🌙 裏の世界への門が開いた…</h2>
      <p>統計の先にある「AI（機械学習・ディープラーニング）」を学ぶ、裏ステージ全${DEEP-HON}町があらわれました。最初は <b>${tnum(S.t+1)} ${N.ja}</b>（${N.th}）。確率ラボは「AIラボ」に変わります。</p>
      ${levelList(HON)}
      <div class="btns"><button class="btn" onclick="enterTown()">この町に残る</button><button class="btn go" onclick="nextTown()">裏ステージへ進む →</button></div></div>`;
    return;
  }
  if(uraLast){
    $('#main').innerHTML=`<div class="page"><h1>🏅 裏ステージをクリア！</h1>
      <h2>AIのしくみと基本の計算をマスター！</h2>${score}
      <h2>💻 さらに奥、「裏の裏」への階段があらわれた…</h2>
      <p>ここからは実装編。これまで学んだ式を、Python（NumPy・PyTorch）のコードで書く「穴埋め」に挑戦します。全${TOWNS.length-DEEP}町。最初は <b>${tnum(S.t+1)} ${N.ja}</b>（${N.th}）。</p>
      ${levelList(DEEP)}
      <div class="btns"><button class="btn" onclick="enterTown()">この町に残る</button><button class="btn go" onclick="nextTown()">裏の裏へ進む →</button></div></div>`;
    return;
  }
  $('#main').innerHTML=`<div class="page"><h1>🎊 ${TN.ja}が幸せになった！</h1>
    <h2>まとめの魔物をたおして、「${TN.th}」をマスター！</h2>
    <p>次は <b>${tnum(S.t+1)} ${N.ja}</b>。テーマは「${N.th}」。</p>
    ${levelList(S.t+1)}
    <div class="btns"><button class="btn" onclick="enterTown()">この町に残る</button><button class="btn go" onclick="nextTown()">次の町へ進む →</button></div></div>`;
}
function nextTown(){if(S.t<S.max){S.t++;save()}closeOv();enterTown()}
function restart(){Object.assign(S,{t:0,max:0,done:[],nh:0,tr:0,fin:0,seen:1});save();enterTown()}
function title(){
  $('#hd').innerHTML='';
  $('#main').innerHTML=`<div class="page"><h1>📊 統計タウンクエスト</h1>
    <h2>町を歩いて、みんなの「統計の悩み」を解決しよう</h2>
    <ol><li>主人公を動かして、！マークの村人に話しかけ、悩みを聞く</li>
    <li>💡マークの村人3人から、たとえ話のヒントを順番にもらう</li>
    <li>★マークの本人のところへもどって、答えを教えてあげる</li>
    <li>全員の悩みを解決すると、広場に「まとめの魔物」があらわれる。たおすと次の町へ</li></ol>
    <p class="note">動かし方：矢印キー / WASD、画面の十字ボタン、またはマップをタップ。確率ラボ・データラボ（裏ステージではAIラボも）でいろいろな実験ができ、図書館（ノート）では公式メモと解説を読み返せます。本編は全${HON}町・${TOWNS.slice(0,HON).reduce((a,t)=>a+t.P.length,0)}問で、統計検定2級の主な範囲をやさしい順に学びます。クリアすると、AIを学ぶ裏ステージ（全${DEEP-HON}町）、さらにPythonコードの穴埋めに挑む裏の裏（全${TOWNS.length-DEEP}町）が開きます。</p>
    ${levelList(0)}
    <div class="btns"><button class="btn go" onclick="start()">▶ ゲームをはじめる</button></div></div>`;
}
function start(){S.seen=1;save();enterTown()}

load();
S.seen?enterTown():title();
</script>
